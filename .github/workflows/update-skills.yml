name: Sync Lovable Skills

on:
  push:
    branches:
      - main # Runs instantly whenever you push changes to your main branch
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab

jobs:
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the runner permission to update skill records
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Instant Lovable Skills Update
        uses: iyaki/skills-update@v1 # <-- FIX: Removed "-action" to match the actual repo name
        with:
          working-directory: '.' 
